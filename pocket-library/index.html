<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>口袋圖書館 Pocket Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        color-scheme: light dark;
        --bg:#f6f1e7;
        --bg-deep:#ece4d3;
        --surface:#fffdf7;
        --surface-2:#efe8d8;
        --ink:#23201a;
        --ink-soft:#5c5546;
        --ink-faint:#8a8172;
        --line:#ddd2bd;
        --brass:#a97b1f;
        --brass-ink:#7d5a12;
        --header-bg:#1e2b26;
        --header-ink:#f3ecd9;
        --header-soft:#b9c4b4;
        --shadow:0 14px 34px rgba(46,38,20,.18);
        --shadow-sm:0 6px 16px rgba(46,38,20,.14);
        --civ:#a86f14;
        --cs:#0e6e63;
        --music:#93302b;
        --transport:#33587e;
        --general:#5f6c46;
        --radius:14px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#16181a;
          --bg-deep:#101214;
          --surface:#20242a;
          --surface-2:#262b33;
          --ink:#ece7db;
          --ink-soft:#b6b0a1;
          --ink-faint:#8b867a;
          --line:#3a4048;
          --brass:#d9a83f;
          --brass-ink:#e5bc63;
          --header-bg:#101613;
          --header-ink:#f3ecd9;
          --header-soft:#93a393;
          --shadow:0 14px 34px rgba(0,0,0,.5);
          --shadow-sm:0 6px 16px rgba(0,0,0,.4);
          --civ:#d99a2b;
          --cs:#2fae9d;
          --music:#d96a5e;
          --transport:#7ea6cf;
          --general:#a3b184;
        }
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{
        margin:0;background:var(--bg);color:var(--ink);
        font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
        -webkit-font-smoothing:antialiased;
      }
      .serif{font-family:"Noto Serif TC",serif}
      a{color:inherit}
      button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

      /* ---------- Header band ---------- */
      .masthead{
        background:var(--header-bg);color:var(--header-ink);
        padding:34px 20px 30px;
        border-bottom:4px solid var(--brass);
      }
      .masthead-inner{max-width:1060px;margin:0 auto}
      .masthead .rule{display:flex;align-items:center;gap:14px;color:var(--brass);font-size:12px;letter-spacing:.35em;margin-bottom:14px}
      .masthead .rule::before,.masthead .rule::after{content:"";height:1px;background:currentColor;opacity:.5;flex:1}
      .masthead h1{
        font-family:"Noto Serif TC",serif;font-weight:900;
        font-size:clamp(40px,9vw,64px);line-height:1.05;margin:0;text-align:center;letter-spacing:.06em;
      }
      .masthead .en{
        text-align:center;letter-spacing:.5em;text-transform:uppercase;
        font-size:12px;color:var(--header-soft);margin-top:10px;text-indent:.5em;
      }
      .masthead .lede{
        text-align:center;max-width:560px;margin:16px auto 0;
        font-size:15px;line-height:1.8;color:var(--header-ink);opacity:.92;
      }
      .masthead .stats{
        display:flex;justify-content:center;gap:0;margin:22px auto 0;max-width:520px;
        border:1px solid rgba(243,236,217,.25);
      }
      .masthead .stats div{flex:1;text-align:center;padding:10px 4px}
      .masthead .stats div+div{border-left:1px solid rgba(243,236,217,.25)}
      .masthead .stats b{display:block;font-family:"Noto Serif TC",serif;font-size:22px;color:var(--brass)}
      .masthead .stats span{font-size:11px;color:var(--header-soft);letter-spacing:.12em}

      /* ---------- Toolbar ---------- */
      .toolbar{
        position:sticky;top:0;z-index:40;
        background:color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        border-bottom:1px solid var(--line);
      }
      .toolbar-inner{max-width:1060px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
      .search-row{display:flex;gap:8px}
      .search-box{
        flex:1;display:flex;align-items:center;gap:8px;
        background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;
      }
      .search-box svg{flex:none;color:var(--ink-faint)}
      .search-box input{
        flex:1;border:0;outline:0;background:transparent;color:var(--ink);
        font:inherit;font-size:15px;min-width:0;
      }
      .search-box input::placeholder{color:var(--ink-faint)}
      .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
      .chips::-webkit-scrollbar{display:none}
      .chip{
        flex:none;border:1px solid var(--line);background:var(--surface);
        border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--ink-soft);
        transition:background .15s,color .15s,border-color .15s;
      }
      .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
      .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

      main{max-width:1060px;margin:0 auto;padding:0 16px 64px}

      /* ---------- Hero carousel ---------- */
      .hero{margin:26px 0 8px}
      .hero-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
      .hero-head h2{font-family:"Noto Serif TC",serif;font-size:21px;margin:0;font-weight:900}
      .hero-head .hint{font-size:12.5px;color:var(--ink-faint)}
      .hero-viewport{position:relative}
      .hero-track{
        display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
        scrollbar-width:none;padding:4px 2px 10px;
      }
      .hero-track::-webkit-scrollbar{display:none}
      .hero-slide{
        flex:0 0 100%;scroll-snap-align:center;position:relative;
        border-radius:18px;overflow:hidden;min-height:340px;
        display:flex;align-items:flex-end;text-decoration:none;
        box-shadow:var(--shadow);isolation:isolate;
      }
      @media(min-width:720px){.hero-slide{flex-basis:86%;min-height:380px}}
      .hero-slide img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
      .hero-slide .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,8,.06) 34%,rgba(10,10,8,.82) 88%)}
      .hero-slide .body{padding:22px;color:#fdf9ec;width:100%}
      .hero-slide .vol{
        display:inline-block;font-size:11.5px;letter-spacing:.22em;font-weight:700;
        border:1px solid rgba(253,249,236,.55);border-radius:999px;padding:4px 10px;margin-bottom:10px;
      }
      .hero-slide .new-flag{background:var(--brass);border-color:var(--brass);color:#fff;margin-left:6px;letter-spacing:.1em}
      .hero-slide h3{font-family:"Noto Serif TC",serif;font-size:clamp(28px,6vw,40px);margin:0 0 6px;font-weight:900;line-height:1.15}
      .hero-slide p{margin:0 0 14px;font-size:14.5px;line-height:1.65;opacity:.94;max-width:520px}
      .hero-slide .open{
        display:inline-flex;align-items:center;gap:8px;background:#fdf9ec;color:#221d10;
        font-weight:700;font-size:14.5px;border-radius:999px;padding:10px 18px;
      }
      .hero-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:2px}
      .hero-btn{
        width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
        background:var(--surface);display:grid;place-items:center;color:var(--ink-soft);
      }
      .hero-btn:active{transform:scale(.94)}
      .hero-dots{display:flex;gap:7px}
      .hero-dots button{width:8px;height:8px;border-radius:50%;background:var(--line);padding:0;transition:all .2s}
      .hero-dots button.on{width:22px;border-radius:99px;background:var(--brass)}

      /* ---------- Series sections ---------- */
      .series{margin-top:44px}
      .series-head{display:flex;align-items:flex-start;gap:14px;margin:0 2px 4px}
      .series-glyph{
        flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
        color:#fff;background:var(--accent);box-shadow:var(--shadow-sm);
      }
      .series-head h2{font-family:"Noto Serif TC",serif;font-size:24px;margin:0;font-weight:900;line-height:1.25}
      .series-head .en-sub{font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
      .series-head p{margin:6px 0 0;font-size:14px;line-height:1.7;color:var(--ink-soft);max-width:640px}
      .series-head .count{margin-left:auto;flex:none;text-align:right;font-size:12px;color:var(--ink-faint);padding-top:6px}
      .series-head .count b{display:block;font-family:"Noto Serif TC",serif;font-size:19px;color:var(--ink)}

      .shelf{margin-top:18px}
      .shelf-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 2px}
      .shelf-head h3{font-size:16.5px;margin:0;font-weight:700}
      .shelf-head .shelf-en{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
      .shelf-head .line{flex:1;height:1px;background:var(--line);align-self:center}

      /* Cover Flow */
      .flow-wrap{position:relative}
      .flow{
        display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;
        padding:26px 38% 30px;scrollbar-width:none;
        perspective:1100px;
      }
      .flow::-webkit-scrollbar{display:none}
      .book{
        flex:0 0 auto;width:158px;scroll-snap-align:center;
        background:none;border:0;padding:0;text-align:center;
        -webkit-tap-highlight-color:transparent;
      }
      @media(min-width:720px){.book{width:178px}}
      .book .cover3d{
        transform-origin:center center;will-change:transform;
        transition:filter .2s;
      }
      .cover{
        position:relative;aspect-ratio:3/4.15;border-radius:5px 10px 10px 5px;overflow:hidden;
        background:var(--accent);color:#fdf9ec;text-align:left;
        box-shadow:var(--shadow-sm);
        display:flex;flex-direction:column;
      }
      .cover::before{ /* spine */
        content:"";position:absolute;left:0;top:0;bottom:0;width:11px;
        background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(0,0,0,.08) 55%,rgba(255,255,255,.14) 78%,rgba(0,0,0,.12));
        z-index:3;
      }
      .cover::after{ /* page edge */
        content:"";position:absolute;right:0;top:3px;bottom:3px;width:3px;
        background:repeating-linear-gradient(180deg,rgba(255,255,255,.5) 0 2px,rgba(0,0,0,.06) 2px 4px);
        opacity:.5;z-index:3;
      }
      .cover .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
      .cover .photo-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,8,6,.14) 40%,rgba(8,8,6,.78))}
      .cover .inner{position:relative;z-index:2;padding:14px 13px 12px 20px;display:flex;flex-direction:column;height:100%}
      .cover .series-tag{font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.85}
      .cover .c-title{
        font-family:"Noto Serif TC",serif;font-weight:900;line-height:1.22;
        font-size:21px;margin-top:auto;
        text-shadow:0 1px 8px rgba(0,0,0,.25);
      }
      .cover .c-title.small{font-size:18px}
      .cover .c-en{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-top:5px;line-height:1.5}
      .cover .c-vol{margin-top:9px;font-size:10.5px;font-weight:700;letter-spacing:.18em;opacity:.9}
      .cover .stamp{
        position:absolute;top:12px;right:10px;z-index:4;
        border:1.5px solid currentColor;border-radius:4px;padding:3px 6px;
        font-size:10px;font-weight:700;letter-spacing:.14em;transform:rotate(7deg);
        background:rgba(10,10,8,.22);
      }
      .book.soon .cover{filter:saturate(.45) brightness(.93)}
      .book.soon .cover .c-title,.book.soon .cover .c-en,.book.soon .cover .series-tag,.book.soon .cover .c-vol{opacity:.75}
      .book .under{margin-top:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.45;min-height:18px}
      .book .under b{color:var(--ink)}
      .book.active .under b{color:var(--brass-ink)}
      .shelf-base{
        height:12px;margin:-16px 6px 0;border-radius:3px;
        background:linear-gradient(180deg,var(--bg-deep),transparent);
        border-top:3px solid var(--line);
      }
      .flow-nav{
        position:absolute;top:38%;z-index:5;width:36px;height:36px;border-radius:50%;
        background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
        display:grid;place-items:center;color:var(--ink-soft);
      }
      .flow-nav.prev{left:2px}.flow-nav.next{right:2px}
      .flow-nav:active{transform:scale(.93)}
      @media(max-width:560px){.flow-nav{display:none}}

      /* Detail panel */
      .detail{
        margin:14px 2px 0;background:var(--surface);border:1px solid var(--line);
        border-left:5px solid var(--accent);border-radius:var(--radius);
        padding:16px 18px;display:flex;gap:16px;align-items:flex-start;
        box-shadow:var(--shadow-sm);
      }
      .detail .d-main{flex:1;min-width:0}
      .detail h4{font-family:"Noto Serif TC",serif;margin:0;font-size:19px;font-weight:900;line-height:1.3}
      .detail .d-en{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px}
      .detail p{margin:8px 0 0;font-size:14px;line-height:1.75;color:var(--ink-soft)}
      .detail .d-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
      .detail .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink-soft)}
      .detail .tag.ready{border-color:var(--accent);color:var(--accent);font-weight:700}
      .d-open{
        flex:none;align-self:center;display:inline-flex;align-items:center;gap:7px;
        background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;
        border-radius:999px;padding:11px 18px;text-decoration:none;box-shadow:var(--shadow-sm);
      }
      .d-open.soon{background:var(--surface-2);color:var(--ink-faint);box-shadow:none;cursor:default}
      @media(max-width:560px){
        .detail{flex-direction:column}
        .d-open{align-self:stretch;justify-content:center}
      }

      /* Search results */
      .results{margin-top:26px;display:none}
      .results.show{display:block}
      .results h2{font-family:"Noto Serif TC",serif;font-size:20px;margin:0 2px 12px}
      .results .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
      .result-card{
        background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
        padding:14px 16px;text-align:left;display:block;width:100%;
        border-top:4px solid var(--accent);
      }
      a.result-card{text-decoration:none}
      .result-card h4{font-family:"Noto Serif TC",serif;margin:0;font-size:16.5px;font-weight:900}
      .result-card .r-en{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
      .result-card p{margin:7px 0 0;font-size:13px;line-height:1.65;color:var(--ink-soft)}
      .result-card .r-foot{margin-top:9px;font-size:12px;font-weight:700;color:var(--accent)}
      .result-card .r-foot.soon{color:var(--ink-faint)}
      .empty{
        display:none;text-align:center;padding:44px 20px;color:var(--ink-soft);
        background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);margin-top:26px;
      }
      .empty.show{display:block}
      .empty .big{font-family:"Noto Serif TC",serif;font-size:19px;color:var(--ink);margin-bottom:6px}

      footer{
        border-top:1px solid var(--line);margin-top:56px;
        padding:26px 20px 40px;text-align:center;color:var(--ink-faint);font-size:12.5px;line-height:2;
      }
      footer .f-title{font-family:"Noto Serif TC",serif;font-size:15px;color:var(--ink-soft);letter-spacing:.2em}
      .hidden{display:none !important}

      @media (prefers-reduced-motion: reduce){
        html{scroll-behavior:auto}
        *{transition:none !important}
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <div class="rule">口袋圖書館</div>
        <h1>口袋圖書館</h1>
        <div class="en">Pocket Library</div>
        <p class="lede">一個題目，一本小書。每本都細細剖開一個世界——有圖解、有故事、有可以動手玩的實驗。先從書架上拿一本下來吧。</p>
        <div class="stats">
          <div><b id="stat-series">4</b><span>大系列 ＋ 通用書架</span></div>
          <div><b id="stat-total">50</b><span>冊全目錄</span></div>
          <div><b id="stat-ready">3</b><span>冊已出版</span></div>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-inner">
        <div class="search-row">
          <label class="search-box">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
            <input id="search" type="search" placeholder="搜尋書名、人物、主題……例如：Miles、加密、飛機" autocomplete="off" />
          </label>
        </div>
        <div class="chips" id="chips" role="group" aria-label="篩選書架"></div>
      </div>
    </div>

    <main>
      <!-- Hero carousel -->
      <section class="hero" id="hero">
        <div class="hero-head">
          <h2>本期精選</h2>
          <span class="hint">左右滑動，翻看已出版的三冊</span>
        </div>
        <div class="hero-viewport">
          <div class="hero-track" id="hero-track"></div>
        </div>
        <div class="hero-nav">
          <button class="hero-btn" id="hero-prev" aria-label="上一本">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="hero-dots" id="hero-dots"></div>
          <button class="hero-btn" id="hero-next" aria-label="下一本">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </section>

      <!-- Search results replace shelves while searching -->
      <section class="results" id="results">
        <h2 id="results-title">搜尋結果</h2>
        <div class="grid" id="results-grid"></div>
      </section>
      <div class="empty" id="empty">
        <div class="big">書架上找不到這一本</div>
        <div>試試其他關鍵字——一個人名、一個主題，或者一項技術。</div>
      </div>

      <div id="shelves"></div>

      <footer>
        <div class="f-title">口袋圖書館 · POCKET LIBRARY</div>
        一個題目，一本小書 —— 剖面圖解 · 真實照片 · 動手實驗<br/>
        已出版的書可以直接打開；封面較淡的是正在籌備的冊次。
      </footer>
    </main>

    <script>
      /* ============ 資料：系列與書目 ============ */
      var GLYPHS = {
        civ: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4L22 20H2Z"/><path d="M12 4v16M7.5 12h9M5.2 16h13.6" stroke-width="1.2" opacity=".65"/></svg>',
        cs: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3"/></svg>',
        music: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></svg>',
        transport: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l18-6-6.5 9.5-2.8-4.6L3 15Z"/><path d="M11.7 13.9L21 9"/></svg>',
        general: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4l2.2 5.3L20 10l-4.2 3.9L17 19.5 12 16.6 7 19.5l1.2-5.6L4 10l5.8-.7Z"/></svg>'
      };

      function B(o){ return o; }

                B({vol:'技術 3', title:'駕駛艙', en:'The Cockpit', status:'soon',
                   blurb:'儀表、自動駕駛與黑盒子：機師在三萬呎高空看些甚麼。',
                   tags:['駕駛艙全景','飛行儀表'], kw:'cockpit pilot 駕駛艙 機師 飛行員'})
              ]
            },
            {
              name:'汽車', en:'Cars',
              books:[
                B({vol:'籌備中', title:'汽車總覽', en:'How a Car Works', status:'soon',
                   blurb:'引擎、波箱、懸掛與煞車——經典的汽車剖面圖，一頁看懂整架車。',
                   tags:['整車剖面圖','引擎運作'], kw:'car automobile engine 汽車 引擎'}),
                B({vol:'類型 1', title:'電動車', en:'Electric Cars', status:'soon',
                   blurb:'電池、馬達與充電：沒有引擎的車如何跑得更快更靜。',
                   tags:['電池剖面','馬達原理'], kw:'electric car ev battery 電動車 電池'}),
                B({vol:'類型 2', title:'賽車', en:'Racing Cars', status:'soon',
                   blurb:'F1 與耐力賽：下壓力、進站與千分一秒的工程。',
                   tags:['下壓力示範','進站流程'], kw:'racing f1 formula 賽車 一級方程式'}),
                B({vol:'類型 3', title:'經典名車', en:'Classic Cars', status:'soon',
                   blurb:'由福特 Model T 到甲蟲車：改變世界的設計，逐架看。',
                   tags:['設計時間線','名車圖鑑'], kw:'classic car vintage 經典 名車 古董車'}),
                B({vol:'技術 1', title:'內燃引擎', en:'The Engine', status:'soon',
                   blurb:'四衝程剖面：活塞、燃燒與曲軸，汽油如何變成動力。',
                   tags:['引擎剖面圖','四衝程動畫'], kw:'engine piston combustion 引擎 活塞 內燃'}),
                B({vol:'技術 2', title:'波箱與傳動', en:'Gears & Transmission', status:'soon',
                   blurb:'手波、自動波與 CVT：齒輪如何把轉速換成速度。',
                   tags:['齒輪互動圖','傳動路線'], kw:'gear transmission gearbox 波箱 齒輪 傳動'}),
                B({vol:'技術 3', title:'安全與輔助駕駛', en:'Safety & Driver Assistance', status:'soon',
                   blurb:'安全氣袋、ABS 與自動煞車：車如何保護車上的人。',
                   tags:['碰撞示範','感應器圖'], kw:'safety airbag abs 安全 氣袋 輔助駕駛'})
              ]
            }
          ]
        },
        {
          id:'general', name:'通用書架', en:'General Shelf', color:'var(--general)', hex:'#5f6c46',
          desc:'不屬於任何系列的單冊題目——每一個都值得自己擁有一本小書。',
          shelves:[{
            name:'單冊題目', en:'One-off Volumes',
            books:[
              B({vol:'籌備中', title:'古羅馬', en:'Ancient Rome — see 古代文明', status:'soon', hidden:true, blurb:'', tags:[], kw:''}),
              B({vol:'籌備中', title:'太空', en:'Space', status:'soon',
                 blurb:'火箭、太空站與行星：離開地球的一冊。',
                 tags:['火箭剖面','太陽系圖'], kw:'space rocket planet 太空 火箭 行星'}),
              B({vol:'籌備中', title:'恐龍', en:'Dinosaurs', status:'soon',
                 blurb:'由三疊紀到隕石撞擊：巨獸的年代與滅絕之謎。',
                 tags:['恐龍圖鑑','化石形成'], kw:'dinosaur fossil 恐龍 化石'}),
              B({vol:'籌備中', title:'人體', en:'The Human Body', status:'soon',
                 blurb:'心臟、大腦與骨骼：最貼身的一部機器，剖開來看。',
                 tags:['器官剖面','血液循環'], kw:'human body anatomy 人體 心臟 大腦'}),
              B({vol:'籌備中', title:'發明', en:'Inventions', status:'soon',
                 blurb:'印刷術、電燈、互聯網——改變日常的點子從哪裡來。',
                 tags:['發明時間線','原理圖解'], kw:'inventions invention history 發明'})
            ]
          }]
        }
      ];
      /* 古羅馬只列於古代文明系列，通用書架不重複 */
      SERIES.forEach(function(s){ s.shelves.forEach(function(sh){ sh.books = sh.books.filter(function(b){ return !b.hidden; }); }); });

      var ALL = [];
      SERIES.forEach(function(s){
        s.shelves.forEach(function(sh){
          sh.books.forEach(function(b){ b.series = s; b.shelf = sh; ALL.push(b); });
        });
      });
      var READY = ALL.filter(function(b){ return b.status === 'ready'; });

      document.getElementById('stat-total').textContent = ALL.length;
      document.getElementById('stat-ready').textContent = READY.length;
      document.getElementById('stat-series').textContent = SERIES.length - 1;
    </script>
    <script>
      /* ============ 渲染：精選輪播 ============ */
      var heroTrack = document.getElementById('hero-track');
      var heroDots = document.getElementById('hero-dots');
      var heroIndex = 0, heroTimer = null;
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      READY.slice().sort(function(a,b){ return (b.isNew?1:0) - (a.isNew?1:0); }).forEach(function(b, i){
        var a = document.createElement('a');
        a.className = 'hero-slide';
        a.href = b.href;
        a.setAttribute('aria-label', '打開《' + b.title + '》');
        a.innerHTML =
          '<img class="bg" src="' + b.img + '" alt="《' + b.title + '》封面照片" />' +
          '<div class="scrim"></div>' +
          '<div class="body">' +
            '<span class="vol">' + b.series.name + ' · ' + b.vol + '</span>' +
            (b.isNew ? '<span class="vol new-flag">最新出版</span>' : '') +
            '<h3>《' + b.title + '小百科》</h3>' +
            '<p>' + b.blurb + '</p>' +
            '<span class="open">打開這本書 ' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
            '</span>' +
          '</div>';
        heroTrack.appendChild(a);
        var d = document.createElement('button');
        d.setAttribute('aria-label', '精選 ' + (i + 1));
        d.addEventListener('click', function(){ goHero(i); restartHero(); });
        heroDots.appendChild(d);
      });

      function heroCount(){ return heroTrack.children.length; }
      function paintHeroDots(){
        for (var i = 0; i < heroDots.children.length; i++){
          heroDots.children[i].classList.toggle('on', i === heroIndex);
        }
      }
      function goHero(i){
        heroIndex = (i + heroCount()) % heroCount();
        var slide = heroTrack.children[heroIndex];
        heroTrack.scrollTo({ left: slide.offsetLeft - heroTrack.offsetLeft - 2, behavior: reduceMotion ? 'auto' : 'smooth' });
        paintHeroDots();
      }
      heroTrack.addEventListener('scroll', function(){
        var mid = heroTrack.scrollLeft + heroTrack.clientWidth / 2;
        var best = 0, bd = 1e9;
        for (var i = 0; i < heroCount(); i++){
          var s = heroTrack.children[i];
          var c = s.offsetLeft - heroTrack.offsetLeft + s.clientWidth / 2;
          if (Math.abs(c - mid) < bd){ bd = Math.abs(c - mid); best = i; }
        }
        if (best !== heroIndex){ heroIndex = best; paintHeroDots(); }
      }, { passive: true });
      document.getElementById('hero-prev').addEventListener('click', function(){ goHero(heroIndex - 1); restartHero(); });
      document.getElementById('hero-next').addEventListener('click', function(){ goHero(heroIndex + 1); restartHero(); });
      function restartHero(){
        if (heroTimer) clearInterval(heroTimer);
        if (reduceMotion) return;
        heroTimer = setInterval(function(){
          if (document.hidden) return;
          goHero(heroIndex + 1);
        }, 5200);
      }
      heroTrack.addEventListener('pointerdown', function(){ if (heroTimer) clearInterval(heroTimer); });
      heroTrack.addEventListener('pointerup', restartHero);
      paintHeroDots(); restartHero();

      /* ============ 渲染：書架與 Cover Flow ============ */
      var shelvesRoot = document.getElementById('shelves');
      var flows = []; // {el, cards:[btn], detail, activeIdx, series}

      function coverHTML(b){
        var photo = b.img ?
          '<img class="photo" src="' + b.img + '" alt="" /><div class="photo-scrim"></div>' : '';
        var stamp = b.next ? '<span class="stamp">下一冊</span>' :
                    (b.status === 'soon' ? '<span class="stamp">即將推出</span>' : '');
        var titleCls = b.title.length >= 7 ? 'c-title small' : 'c-title';
        return '<div class="cover3d"><div class="cover">' + photo +
          '<div class="inner">' +
            '<span class="series-tag">' + b.series.name + '</span>' +
            stamp +
            '<div class="' + titleCls + '">' + b.title + '</div>' +
            '<div class="c-en">' + b.en + '</div>' +
            '<div class="c-vol">' + b.vol + (b.status === 'ready' ? ' · 已出版' : '') + '</div>' +
          '</div></div></div>' +
          '<div class="under"><b>' + b.title + '</b><br/>' + (b.status === 'ready' ? '已出版 · 點按打開' : '籌備中') + '</div>';
      }

      SERIES.forEach(function(s){
        var sec = document.createElement('section');
        sec.className = 'series';
        sec.id = 'series-' + s.id;
        sec.style.setProperty('--accent', s.color);
        var total = 0, ready = 0;
        s.shelves.forEach(function(sh){ sh.books.forEach(function(b){ total++; if (b.status === 'ready') ready++; }); });
        sec.innerHTML =
          '<div class="series-head">' +
            '<div class="series-glyph">' + GLYPHS[s.id] + '</div>' +
            '<div><h2>' + s.name + '</h2><div class="en-sub">' + s.en + '</div>' +
            '<p>' + s.desc + '</p></div>' +
            '<div class="count"><b>' + total + '</b>冊' + (ready ? ' · ' + ready + ' 冊已出版' : '') + '</div>' +
          '</div>';
        s.shelves.forEach(function(sh){
          var shelf = document.createElement('div');
          shelf.className = 'shelf';
          shelf.innerHTML =
            '<div class="shelf-head"><h3>' + sh.name + '</h3><span class="shelf-en">' + sh.en + '</span><span class="line"></span></div>';
          var wrap = document.createElement('div');
          wrap.className = 'flow-wrap';
          var flow = document.createElement('div');
          flow.className = 'flow';
          flow.setAttribute('role', 'list');
          flow.setAttribute('aria-label', sh.name + '書架，左右滑動瀏覽');
          var prev = document.createElement('button');
          prev.className = 'flow-nav prev'; prev.setAttribute('aria-label', '上一本');
          prev.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
          var next = document.createElement('button');
          next.className = 'flow-nav next'; next.setAttribute('aria-label', '下一本');
          next.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
          wrap.appendChild(flow); wrap.appendChild(prev); wrap.appendChild(next);
          shelf.appendChild(wrap);
          var base = document.createElement('div'); base.className = 'shelf-base'; shelf.appendChild(base);

          var detail = document.createElement('div');
          detail.className = 'detail';
          detail.style.setProperty('--accent', s.color);
          shelf.appendChild(detail);
          sec.appendChild(shelf);

          var rec = { el: flow, cards: [], books: sh.books, detail: detail, series: s, activeIdx: 0, raf: 0, shelfEl: shelf, secEl: sec };
          sh.books.forEach(function(b, i){
            var btn = document.createElement('button');
            btn.className = 'book' + (b.status === 'soon' ? ' soon' : '');
            btn.setAttribute('role', 'listitem');
            btn.innerHTML = coverHTML(b);
            btn.addEventListener('click', function(){
              if (rec.activeIdx === i && b.status === 'ready'){ window.location.href = b.href; return; }
              centerCard(rec, i, true);
            });
            flow.appendChild(btn);
            rec.cards.push(btn);
          });
          prev.addEventListener('click', function(){ centerCard(rec, Math.max(0, rec.activeIdx - 1), true); });
          next.addEventListener('click', function(){ centerCard(rec, Math.min(rec.cards.length - 1, rec.activeIdx + 1), true); });
          flow.addEventListener('scroll', function(){
            if (rec.raf) return;
            rec.raf = requestAnimationFrame(function(){ rec.raf = 0; paintFlow(rec); });
          }, { passive: true });
          flows.push(rec);
          setDetail(rec, 0);
        });
        shelvesRoot.appendChild(sec);
      });

      function visibleCards(rec){
        return rec.cards.filter(function(c){ return !c.classList.contains('hidden'); });
      }
      function flowCenter(rec){
        return rec.el.scrollLeft + rec.el.clientWidth / 2;
      }
      function paintFlow(rec){
        var mid = flowCenter(rec);
        var best = -1, bd = 1e9;
        rec.cards.forEach(function(card, i){
          if (card.classList.contains('hidden')) return;
          var c = card.offsetLeft + card.clientWidth / 2;
          var r = (c - mid) / card.clientWidth; // 以書寬為單位的距離
          var cl = Math.max(-2.6, Math.min(2.6, r));
          var inner = card.firstElementChild;
          inner.style.transform =
            'rotateY(' + (cl * -34).toFixed(1) + 'deg)' +
            ' translateZ(' + (150 - Math.min(Math.abs(cl), 2.6) * 62).toFixed(0) + 'px)' +
            ' scale(' + (1 - Math.min(Math.abs(cl), 2.6) * 0.09).toFixed(3) + ')';
          inner.style.filter = 'brightness(' + (1 - Math.min(Math.abs(cl), 2.6) * 0.16).toFixed(2) + ')';
          inner.style.opacity = String(1 - Math.min(Math.abs(cl), 2.6) * 0.13);
          if (Math.abs(c - mid) < bd){ bd = Math.abs(c - mid); best = i; }
        });
        if (best >= 0 && best !== rec.activeIdx){
          rec.activeIdx = best;
          setDetail(rec, best);
        }
        rec.cards.forEach(function(card, i){ card.classList.toggle('active', i === rec.activeIdx); });
      }
      function centerCard(rec, i, smooth){
        var card = rec.cards[i];
        if (!card) return;
        var left = card.offsetLeft - rec.el.clientWidth / 2 + card.clientWidth / 2;
        rec.el.scrollTo({ left: left, behavior: (smooth && !reduceMotion) ? 'smooth' : 'auto' });
        rec.activeIdx = i;
        setDetail(rec, i);
        setTimeout(function(){ paintFlow(rec); }, smooth && !reduceMotion ? 380 : 30);
      }
      function setDetail(rec, i){
        var b = rec.books[i];
        if (!b) { rec.detail.innerHTML = ''; return; }
        var tags = (b.tags || []).map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('');
        var stateTag = b.status === 'ready'
          ? '<span class="tag ready">已出版</span>'
          : '<span class="tag">籌備中 · 即將推出</span>';
        var action = b.status === 'ready'
          ? '<a class="d-open" href="' + b.href + '">打開這本書 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>'
          : '<span class="d-open soon">即將推出</span>';
        rec.detail.innerHTML =
          '<div class="d-main">' +
            '<h4>《' + b.title + '》</h4>' +
            '<div class="d-en">' + b.en + ' · ' + b.vol + '</div>' +
            '<p>' + b.blurb + '</p>' +
            '<div class="d-meta">' + stateTag + tags + '</div>' +
          '</div>' + action;
      }

      /* 初始置中：每個書架第一本（入門冊）置中 */
      function initFlows(){
        flows.forEach(function(rec){ centerCard(rec, 0, false); paintFlow(rec); });
      }
      window.addEventListener('resize', function(){ flows.forEach(paintFlow); });
      window.addEventListener('load', initFlows);
      setTimeout(initFlows, 60);

      /* ============ 篩選與搜尋 ============ */
      var chipsEl = document.getElementById('chips');
      var FILTERS = [
        { id:'all', label:'全部' },
        { id:'civ', label:'古代文明', hex:'#a86f14' },
        { id:'cs', label:'電腦科學', hex:'#0e6e63' },
        { id:'music', label:'音樂', hex:'#93302b' },
        { id:'transport', label:'交通', hex:'#33587e' },
        { id:'general', label:'通用書架', hex:'#5f6c46' },
        { id:'ready', label:'已出版' },
        { id:'soon', label:'即將推出' }
      ];
      var activeFilter = 'all';
      FILTERS.forEach(function(f){
        var c = document.createElement('button');
        c.className = 'chip';
        c.setAttribute('aria-pressed', f.id === 'all' ? 'true' : 'false');
        c.innerHTML = (f.hex ? '<span class="dot" style="background:' + f.hex + '"></span>' : '') + f.label;
        c.addEventListener('click', function(){
          activeFilter = f.id;
          chipsEl.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
          c.setAttribute('aria-pressed', 'true');
          applyFilter();
        });
        chipsEl.appendChild(c);
      });

      var searchInput = document.getElementById('search');
      var resultsEl = document.getElementById('results');
      var resultsGrid = document.getElementById('results-grid');
      var resultsTitle = document.getElementById('results-title');
      var emptyEl = document.getElementById('empty');
      var heroEl = document.getElementById('hero');

      function applyFilter(){
        var q = searchInput.value.trim().toLowerCase();
        if (q){
          /* 搜尋模式：以結果格取代書架 */
          var hits = ALL.filter(function(b){
            var hay = (b.title + ' ' + b.en + ' ' + b.series.name + ' ' + b.blurb + ' ' + (b.tags || []).join(' ') + ' ' + (b.kw || '')).toLowerCase();
            return hay.indexOf(q) >= 0;
          });
          if (activeFilter !== 'all'){
            hits = hits.filter(function(b){
              if (activeFilter === 'ready') return b.status === 'ready';
              if (activeFilter === 'soon') return b.status === 'soon';
              return b.series.id === activeFilter;
            });
          }
          heroEl.classList.add('hidden');
          shelvesRoot.classList.add('hidden');
          resultsEl.classList.add('show');
          resultsTitle.textContent = '搜尋「' + searchInput.value.trim() + '」· ' + hits.length + ' 冊';
          resultsGrid.innerHTML = '';
          hits.forEach(function(b){
            var card = document.createElement(b.status === 'ready' ? 'a' : 'div');
            card.className = 'result-card';
            card.style.setProperty('--accent', b.series.color);
            if (b.status === 'ready') card.href = b.href;
            card.innerHTML =
              '<h4>《' + b.title + '》</h4>' +
              '<div class="r-en">' + b.series.name + ' · ' + b.en + '</div>' +
              '<p>' + b.blurb + '</p>' +
              '<div class="r-foot' + (b.status === 'soon' ? ' soon' : '') + '">' +
                (b.status === 'ready' ? '已出版 · 點按打開' : '籌備中 · 即將推出') + '</div>';
            resultsGrid.appendChild(card);
          });
          emptyEl.classList.toggle('show', hits.length === 0);
          return;
        }
        /* 篩選模式 */
        resultsEl.classList.remove('show');
        emptyEl.classList.remove('show');
        heroEl.classList.toggle('hidden', activeFilter !== 'all');
        shelvesRoot.classList.remove('hidden');
        SERIES.forEach(function(s, si){
          var sec = shelvesRoot.children[si];
          var seriesVisible = activeFilter === 'all' || activeFilter === 'ready' || activeFilter === 'soon' || s.id === activeFilter;
          sec.classList.toggle('hidden', !seriesVisible);
        });
        flows.forEach(function(rec){
          rec.cards.forEach(function(card, i){
            var b = rec.books[i];
            var show = true;
            if (activeFilter === 'ready') show = b.status === 'ready';
            if (activeFilter === 'soon') show = b.status === 'soon';
            card.classList.toggle('hidden', !show);
          });
          var vis = visibleCards(rec);
          rec.shelfEl.classList.toggle('hidden', vis.length === 0);
          if (vis.length){ centerCard(rec, rec.cards.indexOf(vis[0]), false); }
          paintFlow(rec);
        });
        /* 系列內所有書架都空了，整個系列也隱藏 */
        SERIES.forEach(function(s, si){
          var sec = shelvesRoot.children[si];
          if (sec.classList.contains('hidden')) return;
          var anyShelf = flows.some(function(rec){
            return rec.secEl === sec && !rec.shelfEl.classList.contains('hidden');
          });
          sec.classList.toggle('hidden', !anyShelf);
        });
      }
      searchInput.addEventListener('input', applyFilter);
    </script>
  </body>
</html>
